<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>档案侦探 · 笼中密码</title>
  <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a1a url('assets/images/bg/start_bg_clean.png') center/cover no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(10,10,26,0.3) 0%, rgba(10,10,26,0.6) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 背景装饰 */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(148,163,184,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 40px 40px, 40px 40px; }
    }

    .bg-glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.2;
      pointer-events: none;
    }
    .bg-glow.g1 { background: #8b5cf6; top: -150px; left: -100px; animation: float1 8s ease-in-out infinite; }
    .bg-glow.g2 { background: #3b82f6; bottom: -150px; right: -100px; animation: float2 10s ease-in-out infinite; }
    .bg-glow.g3 { background: #f59e0b; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.08; }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 20px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-20px, -30px); }
    }

    /* 主容器 */
    .start-container {
      position: relative;
      z-index: 10;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 游戏标题 */
    .game-title {
      text-align: center;
      margin-bottom: 50px;
      animation: titleIn 1.2s ease-out;
    }
    @keyframes titleIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .title-sub {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 0.5em;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.3s forwards;
    }

    .title-main {
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 900;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 30%, #ef4444 60%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.1em;
      line-height: 1.2;
      margin-bottom: 12px;
      text-shadow: 0 0 60px rgba(251, 191, 36, 0.3);
      opacity: 0;
      animation: fadeIn 1s ease-out 0.5s forwards;
    }

    .title-en {
      font-size: 14px;
      color: #64748b;
      letter-spacing: 0.3em;
      font-family: "Georgia", serif;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.7s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 副标题 */
    .tagline {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 50px;
      text-align: center;
      max-width: 320px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeIn 1s ease-out 1s forwards;
    }

    .tagline .highlight {
      color: #fbbf24;
      font-weight: 600;
    }

    /* 开始按钮 */
    .start-btn {
      position: relative;
      padding: 18px 60px;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.15em;
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4);
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 1s ease-out 1.2s forwards, pulse 2s ease-in-out 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4); }
      50% { box-shadow: 0 4px 30px rgba(251, 191, 36, 0.7); }
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(251, 191, 36, 0.6);
    }
    .start-btn:active {
      transform: translateY(0);
    }

    .start-hint {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.2em;
      opacity: 0;
      animation: fadeIn 1s ease-out 1.5s forwards;
    }

    /* 底部信息 */
    .footer-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.1em;
      text-align: center;
      width: 100%;
      padding: 0 20px;
      opacity: 0;
      animation: fadeIn 1s ease-out 1.8s forwards;
    }

    /* 横屏提示 */
    #landscape-hint {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 100000;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; color: #fbbf24;
      font-size: 18px; text-align: center; padding: 20px;
    }
    #landscape-hint .hint-icon {
      font-size: 64px; margin-bottom: 20px;
      animation: phone-rotate-anim 2s ease-in-out infinite;
    }
    #landscape-hint .hint-text {
      color: #e2e8f0; margin-top: 12px; font-size: 14px;
      opacity: 0.8; max-width: 280px; line-height: 1.6;
    }
    @keyframes phone-rotate-anim {
      0%, 100% { transform: rotate(-90deg); }
      50% { transform: rotate(0deg); }
    }
    @media (orientation: landscape) and (max-width: 900px) and (hover: none) and (pointer: coarse) {
      #landscape-hint { display: flex; }
    }

    /* 加载状态 */
    .loading {
      display: none;
      color: #fbbf24;
      font-size: 14px;
      margin-top: 20px;
      letter-spacing: 0.2em;
    }
    .loading.show { display: block; }
    .loading span {
      display: inline-block;
      animation: loadingDot 1.4s ease-in-out infinite;
    }
    .loading span:nth-child(2) { animation-delay: 0.2s; }
    .loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loadingDot {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- 横屏提示 -->
  <div id="landscape-hint">
    <div class="hint-icon">📱</div>
    <div>请旋转手机</div>
    <div class="hint-text">竖屏体验更佳<br>（可在系统设置中关闭"方向锁定"）</div>
  </div>

  <div class="bg-grid"></div>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>

  <div class="start-container">
    <div class="game-title">
      <div class="title-sub">档案侦探系列</div>
      <div class="title-main">笼中密码</div>
      <div class="title-en">CAGE MASTER</div>
    </div>

    <div class="tagline">
      逆转裁判式演出 × 杀手数独教学<br>
      <span class="highlight">七卷秘术，等你破解</span>
    </div>

    <button class="start-btn" id="startBtn">开 始 游 戏</button>
    <div class="start-hint">点击任意位置开始</div>

    <div class="loading" id="loading">
      加载中<span>.</span><span>.</span><span>.</span>
    </div>

    <div class="footer-info">
      v1.2 · 杀手数独教学游戏 · 建议竖屏游玩
    </div>
  </div>

  <script>
    (function() {
      const startBtn = document.getElementById('startBtn');
      const loading = document.getElementById('loading');

      function startGame() {
        loading.classList.add('show');
        startBtn.style.display = 'none';
        // 延迟一下，让加载动画显示出来，同时解锁音频
        setTimeout(() => {
          window.location.href = 'menu.html';
        }, 300);
      }

      startBtn.addEventListener('click', startGame);
      startBtn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        startGame();
      }, { passive: false });

      // 键盘任意键也可以开始
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          startGame();
        }
      });
    })();
  </script>
</body>
</html>
