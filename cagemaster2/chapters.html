<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title data-i18n="ui.titles.chaptersPage">故事模式 · 章节选择</title>
  <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg" />
  <link rel="stylesheet" href="assets/css/style.css?v=50" />
  <link rel="stylesheet" href="assets/css/style-mobile.css?v=17" />
  <link rel="stylesheet" href="assets/css/seal-system.css?v=10" />
  <style>
    /* 章节选择页样式 - 暖琥珀档案风 */
    body {
      background: #f5ede0;
      background-image:
        radial-gradient(ellipse at 30% 0%, rgba(200, 154, 75, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 100%, rgba(139, 90, 43, 0.06) 0%, transparent 50%),
        url("assets/images/scenes/scene_hall.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", Georgia, serif;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg,
        rgba(245, 237, 224, 0.88) 0%,
        rgba(245, 237, 224, 0.94) 50%,
        rgba(245, 237, 224, 0.98) 100%);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      background: transparent;
      position: relative;
      z-index: 1;
    }

    #chapters-container {
      background: transparent;
      border-radius: 0;
      padding: 20px 16px 40px;
      box-shadow: none;
    }

    #chapters-container h1 {
      text-align: center;
      margin-bottom: 6px;
      color: #3d2c1e;
      font-size: 24px;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #chapters-subtitle {
      text-align: center;
      color: #9c8b7a;
      font-size: 13px;
      margin-bottom: 24px;
      letter-spacing: 0.08em;
      font-family: "Noto Serif SC", serif;
    }

    #chapters-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 62vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* 章节卡片 */
    .chapter-card {
      position: relative;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .chapter-card:active {
      transform: scale(0.98);
    }

    .chapter-card.unlocked {
      background: rgba(253, 248, 239, 0.8);
      border-color: rgba(200, 154, 75, 0.15);
      box-shadow: 0 2px 12px rgba(61, 44, 30, 0.04);
    }

    .chapter-card.unlocked:hover {
      background: rgba(253, 248, 239, 0.95);
      border-color: rgba(200, 154, 75, 0.35);
      transform: translateX(4px);
      box-shadow: 0 4px 16px rgba(200, 154, 75, 0.1);
    }

    .chapter-card.locked {
      background: rgba(232, 220, 200, 0.5);
      border-color: rgba(200, 180, 150, 0.2);
      opacity: 0.7;
      cursor: not-allowed;
    }

    .chapter-card.completed {
      border-color: rgba(200, 154, 75, 0.4);
      background: linear-gradient(135deg,
        rgba(200, 154, 75, 0.1) 0%,
        rgba(224, 185, 114, 0.05) 100%);
      box-shadow: 0 2px 12px rgba(200, 154, 75, 0.08);
    }

    .chapter-card.completed::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, #c89a4b, #e0b972);
    }

    .chapter-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .chapter-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      border: 1px solid rgba(200, 154, 75, 0.2);
    }

    .chapter-titles {
      flex: 1;
      min-width: 0;
    }

    .chapter-title {
      font-size: 16px;
      font-weight: 600;
      color: #3d2c1e;
      margin-bottom: 2px;
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.02em;
    }

    .chapter-subtitle {
      font-size: 12px;
      color: #9c8b7a;
      font-family: "Noto Serif SC", serif;
    }

    .chapter-lock {
      font-size: 20px;
      color: #c4b5a5;
    }

    .chapter-description {
      font-size: 12px;
      color: #6b5340;
      line-height: 1.6;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.85;
      font-family: "Noto Serif SC", serif;
    }

    .chapter-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(200, 154, 75, 0.1);
      color: #a67c35;
      border: 1px solid rgba(200, 154, 75, 0.15);
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.03em;
    }

    .chapter-badge.earned {
      background: linear-gradient(135deg, rgba(200, 154, 75, 0.2), rgba(224, 185, 114, 0.15));
      color: #8b5a1a;
      border-color: rgba(200, 154, 75, 0.3);
    }

    .chapter-progress {
      font-size: 11px;
      color: #9c8b7a;
      font-family: "Noto Serif SC", serif;
    }

    .progress-bar {
      width: 80px;
      height: 5px;
      background: rgba(200, 154, 75, 0.12);
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #c89a4b, #e0b972);
      border-radius: 3px;
      transition: width 0.5s ease;
      box-shadow: 0 0 4px rgba(200, 154, 75, 0.3);
    }

    .chapter-card.locked .progress-bar-fill {
      background: #c4b5a5;
    }

    /* 返回按钮 */
    #back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 16px;
      padding: 10px 16px;
      min-height: 44px;
      background: rgba(253, 248, 239, 0.7);
      border: 1px solid rgba(200, 154, 75, 0.2);
      border-radius: 8px;
      font-size: 13px;
      color: #6b5340;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Noto Serif SC", serif;
      backdrop-filter: blur(4px);
    }

    #back-link:hover {
      background: rgba(200, 154, 75, 0.1);
      border-color: rgba(200, 154, 75, 0.4);
      color: #a67c35;
    }

    #back-link:active {
      transform: scale(0.97);
    }

    /* 滚动条美化 */
    #chapters-list::-webkit-scrollbar {
      width: 4px;
    }
    #chapters-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #chapters-list::-webkit-scrollbar-thumb {
      background: rgba(200, 154, 75, 0.2);
      border-radius: 2px;
    }
    #chapters-list::-webkit-scrollbar-thumb:hover {
      background: rgba(200, 154, 75, 0.35);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="chapters-container">
      <a href="route-select.html" id="back-link" data-i18n="ui.chapters.backToRoutes">← 周目选择</a>
      <h1 id="chapters-title" data-i18n="ui.chapters.title">📖 故事模式</h1>
      <p id="chapters-subtitle" data-i18n="ui.chapters.subtitle">跟随守笼人与阿妍，破解杀手数独的秘术档案</p>

      <div id="chapters-list">
        <div style="text-align:center; padding: 40px; color: #94a3b8;" data-i18n="ui.chapters.loading">加载章节中...</div>
      </div>

      <!-- 印记收集槽（仅第3周目显示） -->
      <div id="seal-slot-wrapper" style="display:none;"></div>
    </div>
  </div>

  <!-- Core 基础模块（底层基础设施，最优先加载） -->
  <script src="core/event-bus.js?v=11"></script>
  <script src="core/layout-detector.js?v=11"></script>
  <script>LayoutDetector.init();</script>
  <script src="core/logger.js?v=11"></script>
  <script src="core/storage.js?v=11"></script>

  <script src="services/audio.js?v=60"></script>
  <script src="services/storage.js?v=50"></script>
  <script src="services/i18n.js?v=50"></script>
  <script src="ui/seal-system.js?v=11"></script>
  <script>
    // 初始化音频
    if (typeof AudioManager !== 'undefined') { AudioManager.init(); }
    let allChapters = [];
    let currentRoute = 1;

    // 周目配置
    const ROUTE_CONFIG = {
      1: {
        title: '📖 第一周目 · 沈墨视角',
        subtitle: '新手侦探 · 跟随剧情，学习杀手数独技巧',
        perspective: 'shenmo'
      },
      2: {
        title: '❄️ 第二周目 · 阿妍视角',
        subtitle: '冷面侦探 · 以不同视角揭开被忽略的线索',
        perspective: 'ayan'
      },
      3: {
        title: '🌻 第三周目 · 莹莹视角',
        subtitle: '寻女之路 · 隐藏关卡与真结局等你发现',
        perspective: 'yingying'
      }
    };

    // 从 URL 读取 route 参数
    function initRoute() {
      const params = new URLSearchParams(window.location.search);
      const routeParam = params.get('route');
      if (routeParam) {
        currentRoute = parseInt(routeParam) || 1;
      }
      // 更新页面标题和描述
      const config = ROUTE_CONFIG[currentRoute] || ROUTE_CONFIG[1];
      document.getElementById('chapters-title').textContent = config.title;
      document.getElementById('chapters-subtitle').textContent = config.subtitle;
      // 更新返回按钮链接
      document.getElementById('back-link').href = 'route-select.html';
    }

    // 加载章节列表
    async function loadChapters() {
      let chapters = [];
      try {
        const res = await fetch('/api/chapters');
        const json = await res.json();
        if (json.code === 0 && json.data) {
          chapters = json.data;
        }
      } catch (e) {
        console.warn('获取章节列表失败：', e.message);
        // 降级：加载本地数据
        chapters = await loadLocalChapters();
      }

      if (!chapters || chapters.length === 0) {
        document.getElementById('chapters-list').innerHTML =
          '<div style="text-align:center; padding: 40px; color: #94a3b8;">' + t('ui.chapters.noData') + '</div>';
        return;
      }

      allChapters = chapters;

      // 根据周目调整章节数据
      adjustChaptersForRoute();

      renderChapters();
    }

    // 降级加载本地章节数据
    async function loadLocalChapters() {
      try {
        const res = await fetch('data/chapters.json');
        const data = await res.json();
        if (Array.isArray(data)) return data;
        // 如果是对象包裹的数组
        if (data && data.chapters) return data.chapters;
        return [];
      } catch (e) {
        console.warn('本地章节数据加载失败：', e.message);
        return getFallbackChapters();
      }
    }

    // 最终降级数据
    function getFallbackChapters() {
      return [
        { chapterId: 1, title: t('ui.chapters.fallbackCh1.title'), subtitle: t('ui.chapters.fallbackCh1.subtitle'), icon: '✉️', color: '#22c55e',
          description: t('ui.chapters.fallbackCh1.desc'),
          badgeId: 'badge_c1_letter', badgeName: t('ui.chapters.fallbackCh1.badgeName'), unlockRequirement: 0, levels: [] },
        { chapterId: 2, title: t('ui.chapters.fallbackCh2.title'), subtitle: t('ui.chapters.fallbackCh2.subtitle'), icon: '🔍', color: '#3b82f6',
          description: t('ui.chapters.fallbackCh2.desc'),
          badgeId: 'badge_c2_clue', badgeName: t('ui.chapters.fallbackCh2.badgeName'), unlockRequirement: 1, levels: [] },
        { chapterId: 3, title: t('ui.chapters.fallbackCh3.title'), subtitle: t('ui.chapters.fallbackCh3.subtitle'), icon: '🕵️', color: '#8b5cf6',
          description: t('ui.chapters.fallbackCh3.desc'),
          badgeId: 'badge_c3_trace', badgeName: t('ui.chapters.fallbackCh3.badgeName'), unlockRequirement: 1, levels: [] },
        { chapterId: 4, title: t('ui.chapters.fallbackCh4.title'), subtitle: t('ui.chapters.fallbackCh4.subtitle'), icon: '📜', color: '#f59e0b',
          description: t('ui.chapters.fallbackCh4.desc'),
          badgeId: 'badge_c4_cipher', badgeName: t('ui.chapters.fallbackCh4.badgeName'), unlockRequirement: 1, levels: [] },
        { chapterId: 5, title: t('ui.chapters.fallbackCh5.title'), subtitle: t('ui.chapters.fallbackCh5.subtitle'), icon: '🏆', color: '#ef4444',
          description: t('ui.chapters.fallbackCh5.desc'),
          badgeId: 'badge_c5_ultimate', badgeName: t('ui.chapters.fallbackCh5.badgeName'), unlockRequirement: 1, levels: [] },
        { chapterId: 6, title: t('ui.chapters.fallbackCh6.title'), subtitle: t('ui.chapters.fallbackCh6.subtitle'), icon: '👑', color: '#ec4899',
          description: t('ui.chapters.fallbackCh6.desc'),
          badgeId: 'badge_c6_master', badgeName: t('ui.chapters.fallbackCh6.badgeName'), unlockRequirement: 1, levels: [] },
        { chapterId: 7, title: t('ui.chapters.fallbackCh7.title'), subtitle: t('ui.chapters.fallbackCh7.subtitle'), icon: '🔮', color: '#a855f7',
          description: t('ui.chapters.fallbackCh7.desc'),
          badgeId: 'badge_c7_master', badgeName: t('ui.chapters.fallbackCh7.badgeName'), unlockRequirement: 6, levels: [] }
      ];
    }

    // 根据周目调整章节数据
    function adjustChaptersForRoute() {
      // route3 添加隐藏章节
      if (currentRoute === 3) {
        // 检查是否已有隐藏章节
        const hasHidden = allChapters.some(c => c.chapterId === 8 || c.isHidden);
        if (!hasHidden) {
          allChapters.push({
            chapterId: 8,
            title: t('ui.chapters.hiddenChapter.title'),
            subtitle: t('ui.chapters.hiddenChapter.subtitle'),
            icon: '🔮',
            color: '#a855f7',
            description: t('ui.chapters.hiddenChapter.desc'),
            badgeId: 'badge_hidden_truth',
            badgeName: t('ui.chapters.hiddenChapter.badgeName'),
            unlockRequirement: 7,
            isHidden: true,
            levels: []
          });
        }
      }
    }

    // 渲染章节列表
    function renderChapters() {
      const list = document.getElementById('chapters-list');
      let html = '';

      allChapters.forEach(chapter => {
        const id = chapter.chapterId;
        const unlocked = checkChapterUnlocked(chapter);
        const progress = getChapterProgressInfo(chapter);
        const badgeEarned = Storage.hasBadge(chapter.badgeId);
        const completed = progress.completed === progress.total && progress.total > 0;

        let cardClass = 'chapter-card ';
        if (!unlocked) cardClass += 'locked';
        else if (completed) cardClass += 'completed';
        else cardClass += 'unlocked';

        const progressPercent = progress.total > 0
          ? Math.round((progress.completed / progress.total) * 100)
          : 0;

        const lockIcon = t('ui.chapters.lockedIcon');
        const badgeLabel = chapter.badgeName || t('ui.chapters.badge');
        const progressText = I18N.formatProgress(progress.completed, progress.total);
        const chapterPrefix = t('ui.chapters.chapterPrefix', { id });

        html += `
          <div class="${cardClass}" data-id="${id}" data-unlocked="${unlocked}">
            <div class="chapter-header">
              <div class="chapter-icon" style="background: ${chapter.color}20; color: ${chapter.color};">
                ${unlocked ? chapter.icon : lockIcon}
              </div>
              <div class="chapter-titles">
                <div class="chapter-title">${chapterPrefix}${chapter.title}</div>
                <div class="chapter-subtitle">${chapter.subtitle || ''}</div>
              </div>
              ${!unlocked ? '<div class="chapter-lock">' + lockIcon + '</div>' : ''}
            </div>
            <div class="chapter-description">${chapter.description || ''}</div>
            <div class="chapter-footer">
              <span class="chapter-badge ${badgeEarned ? 'earned' : ''}">
                ${badgeEarned ? '🏅' : '🎖️'} ${badgeLabel}
              </span>
              <span class="chapter-progress">
                <span class="progress-bar">
                  <span class="progress-bar-fill" style="width: ${progressPercent}%"></span>
                </span>
                ${progressText}
              </span>
            </div>
          </div>
        `;
      });

      list.innerHTML = html;

      // 绑定点击
      document.querySelectorAll('.chapter-card').forEach(card => {
        card.addEventListener('click', () => {
          if (card.dataset.unlocked === 'false') {
            return;
          }
          if (typeof AudioManager !== 'undefined') AudioManager.playClick();
          const id = card.dataset.id;
          window.location.href = 'chapter-levels.html?id=' + id + '&route=' + currentRoute;
        });
      });

      // 第3周目显示印记收集槽
      const sealWrapper = document.getElementById('seal-slot-wrapper');
      if (currentRoute === 3) {
        sealWrapper.style.display = 'block';
        if (typeof SealSystem !== 'undefined') {
          SealSystem.init();
          SealSystem.renderSealSlot(sealWrapper, {
            showLabels: true,
            showCount: true,
            clickable: true
          });
        }
      } else {
        sealWrapper.style.display = 'none';
      }
    }

    // 检查章节是否解锁
    function checkChapterUnlocked(chapter) {
      const id = chapter.chapterId;
      const unlockReq = chapter.unlockRequirement || 0;

      // 开发模式：全部解锁（测试用，正式版设为 false）
      const DEV_UNLOCK_ALL = false;
      if (DEV_UNLOCK_ALL) return true;

      // 调试模式：URL带?unlock=all时全部解锁
      if (window.location.search.includes('unlock=all')) return true;

      // 第一章默认解锁
      if (id === 1) return true;
      if (unlockReq === 0) return true;

      // 检查前一章节通关数
      const prevId = id - 1;
      const prevChapter = allChapters.find(c => c.chapterId === prevId);
      if (!prevChapter) return false;

      const prevProgress = getChapterProgressInfo(prevChapter);
      return prevProgress.completed >= unlockReq;
    }

    // 获取章节进度信息
    function getChapterProgressInfo(chapter) {
      const levels = chapter.levels || [];
      const total = levels.length;
      let completed = 0;

      levels.forEach(level => {
        if (Storage.isTeachingLevelCompleted(level.levelId)) {
          completed++;
        }
      });

      // 如果没有关卡数据，从本地存储的章节进度读取
      if (total === 0) {
        const saved = Storage.getChapterProgress(chapter.chapterId);
        if (saved) {
          return {
            completed: saved.completedLevels || 0,
            total: saved.totalLevels || 0
          };
        }
        return { completed: 0, total: 0 };
      }

      return { completed, total };
    }

    // 启动
    (async function() {
      await I18N.init();
      initRoute();
      loadChapters();
    })();
  </script>
</body>
</html>
