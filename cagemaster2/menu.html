<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title data-i18n="ui.titles.menuPage">档案侦探 · 笼中密码</title>
  <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg" />
  <link rel="stylesheet" href="assets/css/style.css?v=50" />
  <link rel="stylesheet" href="assets/css/style-mobile.css?v=17" />
  <link rel="stylesheet" href="assets/css/vintage-journal.css?v=1" />
  <style>
    /* 主菜单页面样式 - 复古日记本 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f5e6c8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", Georgia, serif;
      overflow: hidden;
      position: relative;
    }

    /* 主容器 */
    .menu-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
    }

    /* 游戏标题 */
    .game-logo {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
    }

    .game-logo .logo-icon {
      font-size: 56px;
      margin-bottom: 12px;
      display: inline-block;
      position: relative;
    }

    /* 火漆印章装饰 */
    .game-logo .logo-icon::after {
      content: '';
      position: absolute;
      top: -8px; right: -16px;
      width: 36px; height: 36px;
      background: radial-gradient(circle at 40% 35%,
        #c43e1c 0%, #8b2500 60%, #6b1a00 100%);
      border-radius: 50%;
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.15),
        inset 0 -2px 3px rgba(0,0,0,0.2),
        0 1px 4px rgba(139,37,0,0.3);
      opacity: 0.85;
    }

    .game-logo .logo-icon::before {
      content: '密';
      position: absolute;
      top: 0; right: -14px;
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(250,243,227,0.9);
      z-index: 1;
      font-family: "Ma Shan Zheng", "KaiTi", cursive;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .game-logo h1 {
      font-size: 32px;
      font-weight: 600;
      color: #2c1810;
      letter-spacing: 0.3em;
      margin-bottom: 8px;
      font-family: "Ma Shan Zheng", "Noto Serif SC", "Songti SC", serif;
    }

    .game-logo .subtitle {
      font-size: 12px;
      color: #8b7355;
      letter-spacing: 0.3em;
      font-family: "Noto Serif SC", serif;
    }

    /* 装饰分隔线 */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 24px;
      width: 100%;
      max-width: 200px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 115, 85, 0.3), transparent);
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: #b8860b;
      transform: rotate(45deg);
    }

    /* 统计条 */
    .stats-bar {
      display: flex;
      gap: 0;
      margin: 0 0 32px;
      padding: 16px 20px;
      background: rgba(250, 243, 227, 0.8);
      border: 1px solid rgba(139, 115, 85, 0.15);
      border-radius: 2px;
      width: 100%;
      max-width: 320px;
    }

    .stat-item {
      text-align: center;
      flex: 1;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 600;
      color: #2c1810;
      font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    }

    .stat-label {
      font-size: 11px;
      color: #8b7355;
      margin-top: 4px;
      letter-spacing: 0.1em;
    }

    .stat-divider {
      width: 1px;
      background: rgba(139, 115, 85, 0.15);
      margin: 4px 0;
    }

    /* 菜单按钮 */
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .menu-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border: 1px solid rgba(139, 115, 85, 0.15);
      border-radius: 2px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 500;
      color: #2c1810;
      text-decoration: none;
      transition: all 0.2s;
      overflow: hidden;
      text-align: left;
      background: rgba(250, 243, 227, 0.7);
    }

    .menu-btn:active {
      transform: scale(0.98);
      background: rgba(232, 213, 168, 0.7);
    }

    .menu-btn .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      background: rgba(139, 115, 85, 0.08);
      border: 1px solid rgba(139, 115, 85, 0.12);
    }

    .menu-btn .btn-text {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .menu-btn .btn-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.05em;
    }

    .menu-btn .btn-desc {
      font-size: 12px;
      font-weight: 400;
      color: #8b7355;
      letter-spacing: 0.02em;
    }

    .menu-btn .btn-arrow {
      font-size: 22px;
      opacity: 0.3;
      transition: all 0.2s;
      color: #b8860b;
      position: relative;
      z-index: 1;
    }

    /* 故事模式按钮高亮 */
    .btn-story {
      background: rgba(250, 243, 227, 0.9);
      border-color: rgba(184, 134, 11, 0.3);
    }

    .btn-story .btn-icon {
      background: rgba(184, 134, 11, 0.1);
      border-color: rgba(184, 134, 11, 0.2);
    }

    /* 底部版本号 */
    .version-info {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom));
      font-size: 10px;
      color: #8b7355;
      opacity: 0.4;
      letter-spacing: 0.2em;
      z-index: 1;
    }

    /* 响应式：横屏 */
    @media (orientation: landscape) and (max-height: 500px) {
      .menu-container {
        padding: 20px;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        max-width: 700px;
      }
      .game-logo {
        width: 100%;
        margin-bottom: 8px;
      }
      .game-logo h1 { font-size: 24px; }
      .game-logo .logo-icon { font-size: 40px; margin-bottom: 6px; }
      .stats-bar { margin: 8px 0 16px; max-width: 280px; }
      .menu-buttons {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .menu-btn {
        flex: 1;
        min-width: 180px;
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 横屏提示（手机横屏时显示） -->
  <div id="landscape-hint">
    <div class="hint-icon">📱</div>
    <div>请旋转手机</div>
    <div class="hint-text">竖屏体验更佳<br>（可在系统设置中关闭"方向锁定"）</div>
  </div>

  <div class="menu-container">
    <!-- Logo 区域 -->
    <div class="game-logo">
      <div class="logo-icon" data-i18n="ui.menu.logo">🔐</div>
      <h1 data-i18n="ui.menu.gameTitle">笼中密码</h1>
      <div class="subtitle" data-i18n="ui.menu.subtitle">档案侦探 · KILLER SUDOKU</div>
    </div>

    <!-- 装饰分隔线 -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <!-- 统计条 -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-value" id="statCompleted">0</div>
        <div class="stat-label" data-i18n="ui.menu.statsCompleted">已通关</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="statBadges">0</div>
        <div class="stat-label" data-i18n="ui.menu.statsBadges">徽章</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="statTime">0m</div>
        <div class="stat-label" data-i18n="ui.menu.statsTotalTime">总用时</div>
      </div>
    </div>

    <!-- 菜单按钮 -->
    <div class="menu-buttons">
      <!-- 故事模式 -->
      <a href="route-select.html" class="menu-btn btn-story">
        <div class="btn-icon">📖</div>
        <div class="btn-text">
          <div class="btn-title" data-i18n="ui.menu.storyMode">故事模式</div>
          <div class="btn-desc" data-i18n="ui.menu.storyModeDesc">跟随剧情，学习杀手数独技巧</div>
        </div>
        <div class="btn-arrow">›</div>
      </a>

      <!-- 自由模式 -->
      <a href="free-play.html" class="menu-btn btn-free">
        <div class="btn-icon">🧩</div>
        <div class="btn-text">
          <div class="btn-title" data-i18n="ui.menu.freeMode">数独谜题</div>
          <div class="btn-desc" data-i18n="ui.menu.freeModeDesc">300道精选谜题，三种难度</div>
        </div>
        <div class="btn-arrow">›</div>
      </a>

      <!-- 设置 -->
      <a href="options.html" class="menu-btn btn-settings">
        <div class="btn-icon">⚙️</div>
        <div class="btn-text">
          <div class="btn-title" data-i18n="ui.menu.settings">设置</div>
          <div class="btn-desc" data-i18n="ui.menu.settingsDesc">音乐、音效、进度管理</div>
        </div>
        <div class="btn-arrow">›</div>
      </a>
    </div>
  </div>

  <div class="version-info" data-i18n="ui.menu.version">v1.0.0</div>

  <script src="config/app-config.js?v=11"></script>

  <!-- Core 模块（底层基础设施，最优先加载） -->
  <script src="core/event-bus.js?v=11"></script>
  <script src="core/layout-detector.js?v=11"></script>
  <script>LayoutDetector.init();</script>
  <script src="core/logger.js?v=11"></script>
  <script src="core/storage.js?v=11"></script>


  <script src="services/platform.js?v=11"></script>
  <script src="services/resource-manager.js?v=12"></script>
  <script src="services/audio.js?v=60"></script>
  <script>if (typeof AudioManager !== 'undefined') { AudioManager.init(); }</script>
  <script src="services/storage.js?v=50"></script>
  <script src="services/i18n.js?v=50"></script>
  <script src="services/bgm-bridge.js?v=13"></script>
  <script>if (typeof BGMEngine !== 'undefined') BGMEngine.init();</script>
  <script>
    // 初始化i18n
    (async function() {
      await I18N.init();
    })();

    // 加载统计数据
    function loadStats() {
      try {
        const stats = Storage.getStats();
        const badges = Storage.getTeachingBadgesAll();
        const badgeCount = Object.values(badges).filter(b => b && b.earned).length;

        // 计算已通关数（故事模式+自由模式）
        let totalCompleted = stats.totalCompleted || 0;
        const teachingComplete = Storage.getTeachingCompleteAll();
        totalCompleted += Object.keys(teachingComplete).length;

        document.getElementById('statCompleted').textContent = totalCompleted;
        document.getElementById('statBadges').textContent = badgeCount;

        // 格式化总时间
        const totalSec = stats.totalTime || 0;
        const hours = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        document.getElementById('statTime').textContent = hours > 0 ? `${hours}h${mins}m` : `${mins}m`;
      } catch(e) {
        console.warn('加载统计失败:', e);
      }
    }

    loadStats();

    // 按钮音效
    document.querySelectorAll('.menu-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (typeof AudioManager !== 'undefined') {
          AudioManager.playClick();
        }
      });
    });

    // 启动菜单BGM
    (function startMenuBGM() {
      const startBGM = () => {
        if (typeof BGMEngine !== 'undefined') {
          BGMEngine.playMenu();
        }
        document.removeEventListener('click', startBGM);
        document.removeEventListener('touchstart', startBGM);
        document.removeEventListener('keydown', startBGM);
      };
      document.addEventListener('click', startBGM, { once: true });
      document.addEventListener('touchstart', startBGM, { once: true });
      document.addEventListener('keydown', startBGM, { once: true });
    })();
  </script>
</body>
</html>
