<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对战回放器</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --ink: #e8e8e8;
    --muted: #8899aa;
    --accent: #e94560;
    --accent2: #f5a623;
    --border: #2a2a4a;
    --ying: #4fc3f7;
    --yingBg: rgba(79,195,247,0.2);
    --ayan: #ef5350;
    --ayanBg: rgba(239,83,80,0.2);
    --given: #888;
    --givenBg: #2a2a3a;
    --correct: #66bb6a;
    --wrong: #ef5350;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  #header {
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #header h1 { font-size: 16px; font-weight: 600; color: var(--accent2); }
  #header .info { font-size: 12px; color: var(--muted); }
  #header .info span { margin-right: 12px; }
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  #left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
  }
  #board-wrapper {
    position: relative;
  }
  #board {
    display: grid;
    gap: 1px;
    background: var(--border);
    border: 2px solid var(--border);
    border-radius: 4px;
    position: relative;
  }
  .cell {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    background: var(--bg);
    position: relative;
    transition: background 0.15s, transform 0.1s;
  }
  .cell.given { background: var(--givenBg); color: var(--given); }
  .cell.ying { background: var(--yingBg); color: var(--ying); }
  .cell.ayan { background: var(--ayanBg); color: var(--ayan); }
  .cell.ying-just-filled { background: var(--ying); color: #fff; transform: scale(1.05); }
  .cell.ayan-just-filled { background: var(--ayan); color: #fff; transform: scale(1.05); }
  .cell.wrong { background: var(--wrong) !important; color: #fff !important; }
  .cell.under-siege { outline: 3px solid var(--accent2); outline-offset: -3px; z-index: 2; }
  .cell .cage-sum {
    position: absolute;
    top: 1px;
    left: 3px;
    font-size: 9px;
    font-weight: 400;
    color: var(--muted);
  }
  .cell.given .cage-sum { color: #666; }
  #stats-bar {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-radius: 8px;
    font-size: 13px;
    align-items: center;
  }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-item .label { color: var(--muted); font-size: 11px; }
  .stat-item .value { font-weight: 700; font-size: 15px; }
  .stat-item .value.ying-color { color: var(--ying); }
  .stat-item .value.ayan-color { color: var(--ayan); }
  .stat-item .value.accent-color { color: var(--accent2); }
  .combo-indicator { padding: 2px 10px; border-radius: 12px; background: var(--surface2); font-size: 13px; }
  .combo-indicator.active { background: var(--accent2); color: #000; }
  #focus-bar-container {
    width: 120px;
    height: 8px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
  }
  #focus-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.2s;
  }
  #event-bar {
    margin-top: 8px;
    font-size: 13px;
    color: var(--accent2);
    min-height: 20px;
    text-align: center;
  }
  #right-panel {
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #right-panel h3 {
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  #event-log {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    font-size: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
  }
  .event-entry {
    padding: 3px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex;
    gap: 8px;
  }
  .event-entry .step-no { color: var(--muted); width: 30px; flex-shrink: 0; }
  .event-entry .player-icon { width: 16px; flex-shrink: 0; }
  .event-entry.ying .player-icon { color: var(--ying); }
  .event-entry.ayan .player-icon { color: var(--ayan); }
  .event-entry .desc { color: var(--ink); flex: 1; }
  .event-entry .event-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    background: var(--surface2);
    color: var(--accent2);
  }
  .event-entry.current { background: rgba(245,166,35,0.08); }
  #controls {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #controls button {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 6px;
    background: var(--surface2);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #controls button:hover { background: var(--accent); }
  #controls button:active { transform: scale(0.95); }
  #controls button:disabled { opacity: 0.3; cursor: default; }
  #controls .speed-btn {
    font-size: 11px;
    width: auto;
    padding: 0 10px;
  }
  #controls .speed-btn.active { background: var(--accent2); color: #000; }
  #timeline-container {
    width: 100%;
    padding: 0 12px;
    margin-top: 4px;
  }
  #timeline {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  #timeline::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
  }
  #drop-zone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    flex-direction: column;
    gap: 12px;
  }
  #drop-zone.hidden { display: none; }
  #drop-zone p { font-size: 16px; color: var(--muted); }
  #drop-zone .btn {
    padding: 10px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #drop-zone .btn:hover { opacity: 0.9; }
  #file-input { display: none; }
  #step-counter {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  @media (max-width: 768px) {
    #right-panel { width: 200px; }
    .cell { width: 44px; height: 44px; font-size: 17px; }
    #stats-bar { font-size: 11px; gap: 10px; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div id="header">
  <h1>⚔ AI 对战回放器</h1>
  <div class="info">
    <span id="h-level">关卡: --</span>
    <span id="h-params">参数: --</span>
    <span id="h-frames">帧数: --</span>
  </div>
</div>

<div id="main">
  <div id="left-panel">
    <div id="drop-zone">
      <p>拖拽 replay JSON 到此处</p>
      <p style="font-size:13px;color:#666">或</p>
      <button class="btn" onclick="document.getElementById('file-input').click()">选择文件</button>
      <input type="file" id="file-input" accept=".json">
    </div>
    <div id="board-wrapper">
      <div id="board"></div>
    </div>
    <div id="stats-bar">
      <div class="stat-item">
        <span class="label">莹莹</span>
        <span class="value ying-color" id="stat-ying">0</span>
      </div>
      <div class="stat-item">
        <span class="label">阿妍</span>
        <span class="value ayan-color" id="stat-ayan">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Combo</span>
        <span class="value accent-color" id="stat-combo">0</span>
      </div>
      <div class="stat-item">
        <span class="label">专注</span>
        <div id="focus-bar-container"><div id="focus-bar-fill" style="width:50%"></div></div>
      </div>
      <div class="stat-item">
        <span class="label">步</span>
        <span class="value" id="stat-step">0/0</span>
      </div>
    </div>
    <div id="event-bar"></div>
  </div>
  <div id="right-panel">
    <h3>事件日志</h3>
    <div id="event-log"></div>
    <div id="controls">
      <button id="btn-play" title="播放/暂停">▶</button>
      <button id="btn-prev" title="上一步">⏮</button>
      <button id="btn-next" title="下一步">⏭</button>
      <button id="btn-speed" class="speed-btn" data-speed="1">1×</button>
      <button id="btn-end" title="跳到结尾">⏩</button>
      <span id="step-counter">0 / 0</span>
    </div>
    <div id="timeline-container">
      <input type="range" id="timeline" min="0" max="1" value="0" step="1">
    </div>
  </div>
</div>

<script>
// ============= 回放引擎 =============
const replay = {
  data: null,
  frame: -1,       // current frame index (-1 = initial state)
  playing: false,
  timer: null,
  speed: 1,
  totalFrames: 0,
};

// DOM refs
const $ = (id) => document.getElementById(id);
const boardEl = $('board');
const eventLog = $('event-log');
const timeline = $('timeline');
const stepCounter = $('step-counter');

// ============= 盘面渲染 =============
function renderBoard() {
  if (!replay.data) return;
  const d = replay.data;
  const size = d.gridSize || 6;
  const frame = replay.frame < 0 ? null : d.frames[replay.frame];
  const prevFrame = replay.frame > 0 ? d.frames[replay.frame - 1] : null;

  // Build ownership grid
  const owner = [];
  for (let r = 0; r < size; r++) {
    owner[r] = [];
    for (let c = 0; c < size; c++) {
      const given = d.board[r][c];
      if (given > 0) { owner[r][c] = 'given'; }
      else { owner[r][c] = null; } // empty
    }
  }

  // Apply moves up to current frame
  const fillValues = [];
  for (let r = 0; r < size; r++) {
    fillValues[r] = [];
    for (let c = 0; c < size; c++) {
      fillValues[r][c] = d.board[r][c] > 0 ? d.board[r][c] : 0;
    }
  }

  let lastMove = null;
  if (frame) {
    for (let i = 0; i <= replay.frame; i++) {
      const f = d.frames[i];
      fillValues[f.row][f.col] = f.num;
      owner[f.row][f.col] = f.player;
      lastMove = f;
    }
  }

  // Build HTML
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  boardEl.innerHTML = '';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;

      const val = fillValues[r][c];
      const own = owner[r][c];

      if (own === 'given') {
        cell.classList.add('given');
        cell.textContent = val;
      } else if (own === 'ying') {
        cell.classList.add('ying');
        cell.textContent = val;
        // Check if this was the last move
        if (lastMove && lastMove.row === r && lastMove.col === c && lastMove.player === 'ying') {
          cell.classList.add('ying-just-filled');
        }
      } else if (own === 'ayan') {
        cell.classList.add('ayan');
        cell.textContent = val;
        if (lastMove && lastMove.row === r && lastMove.col === c && lastMove.player === 'ayan') {
          cell.classList.add('ayan-just-filled');
        }
      }

      // Wrong marker
      if (lastMove && lastMove.row === r && lastMove.col === c && lastMove.correct === false) {
        cell.classList.add('wrong');
      }

      // Under siege highlight
      if (frame && frame.underSiege && frame.underSiege.r === r && frame.underSiege.c === c) {
        cell.classList.add('under-siege');
      }

      // Cage sum label
      if (d.cages) {
        for (const cage of d.cages) {
          if (cage.cells.some(([cr, cc]) => cr === r && cc === c)) {
            const sumEl = document.createElement('span');
            sumEl.className = 'cage-sum';
            sumEl.textContent = cage.sum;
            cell.appendChild(sumEl);
            break;
          }
        }
      }

      boardEl.appendChild(cell);
    }
  }
}

// ============= 统计 & 事件 =============
function updateStats() {
  if (!replay.data) return;
  const d = replay.data;
  const frame = replay.frame < 0 ? null : d.frames[replay.frame];

  if (frame) {
    $('stat-ying').textContent = frame.yingCount;
    $('stat-ayan').textContent = frame.aiCount;
    $('stat-combo').textContent = frame.combo || 0;
    $('stat-step').textContent = `${frame.step || replay.frame + 1}/${d.frames.length}`;
    if (frame.focusBar !== undefined) {
      $('focus-bar-fill').style.width = `${Math.round(frame.focusBar * 100)}%`;
    }
  } else {
    $('stat-ying').textContent = '0';
    $('stat-ayan').textContent = '0';
    $('stat-combo').textContent = '0';
    $('stat-step').textContent = `0/${d.frames.length}`;
    $('focus-bar-fill').style.width = '50%';
  }

  // Event bar
  const evBar = $('event-bar');
  if (frame && frame.event) {
    const ev = frame.event;
    const detail = frame.eventDetail || '';
    const evLabels = {
      intercept: '🛡 拦截！',
      parry: '⚔ 招架！',
      deathblow: '💀 忍杀！',
      combo: '🔥 连击！',
      siege_start: '⚠ 蓄力开始！',
      siege_end: '✅ 蓄力结束',
      counter: '↩ 反击！',
    };
    evBar.textContent = `${evLabels[ev] || ev} ${detail}`;
  } else if (frame) {
    evBar.textContent = frame.correct ? '✓ 正确' : '✗ 错误';
  } else {
    evBar.textContent = '';
  }

  // Timeline
  const max = d.frames.length > 0 ? d.frames.length - 1 : 0;
  timeline.max = max;
  timeline.value = replay.frame < 0 ? 0 : replay.frame;
  stepCounter.textContent = `${replay.frame < 0 ? 0 : replay.frame + 1} / ${d.frames.length}`;
}

function updateEventLog() {
  if (!replay.data) return;
  eventLog.innerHTML = '';
  const d = replay.data;
  d.frames.forEach((f, i) => {
    const entry = document.createElement('div');
    entry.className = `event-entry ${f.player}`;
    if (i === replay.frame) entry.classList.add('current');

    const stepNo = document.createElement('span');
    stepNo.className = 'step-no';
    stepNo.textContent = i + 1;
    entry.appendChild(stepNo);

    const icon = document.createElement('span');
    icon.className = 'player-icon';
    icon.textContent = f.player === 'ying' ? '莹' : '妍';
    entry.appendChild(icon);

    const desc = document.createElement('span');
    desc.className = 'desc';
    let txt = `(${f.row},${f.col}) ← ${f.num}`;
    if (f.event) {
      const evLabels = {
        intercept: ' 🛡拦截', parry: ' ⚔招架', deathblow: ' 💀忍杀',
        combo: ' 🔥连击', siege_start: ' ⚠蓄力', siege_end: ' ✅蓄力结束',
        counter: ' ↩反击',
      };
      txt += evLabels[f.event] || '';
    }
    desc.textContent = txt;
    entry.appendChild(desc);

    if (f.event) {
      const tag = document.createElement('span');
      tag.className = 'event-tag';
      tag.textContent = f.event;
      entry.appendChild(tag);
    }

    eventLog.appendChild(entry);
  });

  // Scroll to current
  const current = eventLog.querySelector('.current');
  if (current) current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ============= 播放控制 =============
function goToFrame(idx) {
  if (!replay.data || replay.data.frames.length === 0) return;
  if (idx < -1) idx = -1;
  if (idx >= replay.data.frames.length) idx = replay.data.frames.length - 1;
  replay.frame = idx;
  renderBoard();
  updateStats();
  updateEventLog();
}

function goToStart() { goToFrame(-1); }
function goToEnd() { goToFrame(replay.data ? replay.data.frames.length - 1 : -1); }

function prevStep() {
  if (!replay.data) return;
  goToFrame(replay.frame - 1);
}

function nextStep() {
  if (!replay.data) return;
  if (replay.frame >= replay.data.frames.length - 1) { stop(); return; }
  goToFrame(replay.frame + 1);
}

function togglePlay() {
  if (!replay.data || replay.data.frames.length === 0) return;
  if (replay.playing) { stop(); return; }
  if (replay.frame >= replay.data.frames.length - 1) goToFrame(-1);
  replay.playing = true;
  $('btn-play').textContent = '⏸';
  tick();
}

function stop() {
  replay.playing = false;
  if (replay.timer) { clearTimeout(replay.timer); replay.timer = null; }
  $('btn-play').textContent = '▶';
}

function tick() {
  if (!replay.playing) return;
  nextStep();
  if (replay.playing) {
    const base = 600;
    const interval = base / replay.speed;
    replay.timer = setTimeout(tick, interval);
  }
}

function setSpeed(s) {
  replay.speed = s;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.speed-btn[data-speed="${s}"]`).classList.add('active');
  if (replay.playing) {
    if (replay.timer) clearTimeout(replay.timer);
    tick();
  }
}

// ============= 数据加载 =============
function loadReplay(data) {
  // Validate
  if (!data.frames || !data.board || !data.gridSize) {
    alert('无效的回放数据：缺少 frames/board/gridSize');
    return;
  }
  replay.data = data;
  replay.frame = -1;
  replay.playing = false;
  if (replay.timer) { clearTimeout(replay.timer); replay.timer = null; }
  $('btn-play').textContent = '▶';

  // Header info
  $('h-level').textContent = `关卡: ${data.level || '?'}`;
  const p = data.params || {};
  $('h-params').textContent = `冷却:${p.cooldown||'-'} 蓄力:${p.siegeMs||'-'} 专注:${p.focusGain||'-'}`;
  $('h-frames').textContent = `帧数: ${data.frames.length}`;

  // Hide drop zone
  $('drop-zone').classList.add('hidden');

  goToFrame(-1);
}

// File loading
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      loadReplay(data);
    } catch (err) {
      alert('JSON 解析失败: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// Drag & drop
document.addEventListener('dragover', (e) => { e.preventDefault(); });
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.json')) loadFile(file);
});

$('file-input').addEventListener('change', (e) => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

// ============= 键盘快捷键 =============
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ':
    case 'k': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft':
    case 'a': e.preventDefault(); prevStep(); break;
    case 'ArrowRight':
    case 'd': e.preventDefault(); nextStep(); break;
    case 'Home': e.preventDefault(); goToStart(); break;
    case 'End': e.preventDefault(); goToEnd(); break;
  }
});

// ============= 事件绑定 =============
$('btn-play').addEventListener('click', togglePlay);
$('btn-prev').addEventListener('click', prevStep);
$('btn-next').addEventListener('click', nextStep);
$('btn-end').addEventListener('click', goToEnd);
document.querySelectorAll('.speed-btn').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
timeline.addEventListener('input', () => {
  if (replay.data) goToFrame(Number(timeline.value));
});

// Init: show drop zone
$('drop-zone').classList.remove('hidden');

// ============= URL 参数加载 =============
(function() {
  try {
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    if (file) {
      fetch(file).then(r => r.json()).then(d => { loadReplay(d); }).catch(e => console.warn('Fetch load failed:', e));
    }
    const hash = location.hash.slice(1);
    if (hash) {
      const hp = new URLSearchParams(hash);
      const dataStr = hp.get('data');
      if (dataStr) {
        const data = JSON.parse(decodeURIComponent(dataStr));
        loadReplay(data);
      }
    }
  } catch(e) {
    console.warn('No URL data');
  }
})();

console.log('回放器已就绪。拖拽 replay JSON 文件或点击选择文件。');
</script>
</body>
</html>
